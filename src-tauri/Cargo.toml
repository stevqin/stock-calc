[package]
name = "t-calculator"
version = "0.8.0"
description = "A-share and ETF round-trip cost calculator"
authors = ["Stev"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "t_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "json"] }
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util", "test-util"] }
tokio-util = "0.7"
uuid = { version = "=1.26.0", features = ["v4"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSGlassEffectView", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSCell", "NSColor", "NSAttributedString", "NSFont", "NSText", "NSTextField", "NSResponder", "NSScreen", "NSEvent", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSAttributedString", "NSRange", "NSString"] }

[profile.release]
strip = "debuginfo"
lto = true
codegen-units = 1
opt-level = "s"

# macOS 27 dyld rejects some stripped proc-macro dylibs (LINKEDIT alignment).
# Host build dependencies are not shipped; leave them unstripped.
[profile.release.build-override]
strip = false
